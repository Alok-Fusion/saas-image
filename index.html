  <!-- Theme bootstrap to prevent flash of wrong theme -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('imagekit_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Cookie-free Privacy Analytics (Active only when token configured) -->
  <script>
    (function () {
      try {
        var token = window.__CF_BEACON_TOKEN__;
        if (token) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          s.setAttribute('data-cf-beacon', '{"token": "' + token + '"}');
          document.head.appendChild(s);
        }
      } catch (e) {}
    })();
  </script>
